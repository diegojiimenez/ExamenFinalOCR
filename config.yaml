# Configuración del Sistema OCR

model:
  path: "models/trained_model.h5"  # 🔄 CAMBIADO: best_model → trained_model
  input_shape: [28, 28, 1]
  char_map: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"

preprocessing:
  blur_kernel: 5
  adaptive_thresh_block: 11
  adaptive_thresh_c: 2
  
segmentation:
  min_area: 50
  min_width: 5
  min_height: 10

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  test_split: 0.2

paths:
  # Carpetas principales de datos
  data_root: "data/"
  dataset: "data/dataset/"
  referencia: "data/referencia/"
  pruebas: "data/pruebas/"
  test_images: "data/pruebas/"
  output: "output/"
  
  # Sub-carpetas de dataset
  dataset_ia: "data/dataset/DATASET_IA/"
  dataset_completo: "data/dataset/datasetCompleto/"
  dataset_completo2: "data/dataset/DatasetCompleto2/"
  
  # Sub-carpetas de referencia
  mayusculas: "data/referencia/Mayúsculas/"
  minusculas: "data/referencia/Minúsculas/"
  numeros: "data/referencia/Números/"